name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Everything that does not need a mobile workload: service, web, evidence,
  # verifier, contracts, and the architecture rules (ARCHITECTURE.md §5.3).
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PersonalRecorder.slnx

      - name: Build
        run: dotnet build PersonalRecorder.slnx --no-restore -c Release

      - name: Test
        run: dotnet test PersonalRecorder.slnx --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish web (PWA)
        run: dotnet publish components/web/src/PersonalRecorder.Web -c Release -o artifacts/web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  # Android build runs separately: the workload install is slow and its failures should
  # be legible on their own rather than mixed into the core build.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workloads
        run: dotnet workload install maui-android android

      - name: Build capture core and shell
        run: |
          dotnet build components/client/src/PersonalRecorder.Client.Capture.Android -c Release
          dotnet build components/client/src/PersonalRecorder.Client.AndroidHarness -c Release
          dotnet build components/client/src/PersonalRecorder.Client.App -c Release

      # APK packaging and signing land with distribution v1 (ADR-012). Signing keys are
      # generated offline in a documented ceremony and never enter this repository.
