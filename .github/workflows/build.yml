name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Everything that needs no mobile workload: Core, the portable flavour of Client,
  # Service, Web, Verifier, and the tests (including the architecture rules,
  # ARCHITECTURE.md §5.3). The solution filter leaves out the Android-only App and
  # Harness; IncludeMobileTargets=false drops Client's net10.0-android flavour.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PersonalRecorder.WorkloadFree.slnf -p:IncludeMobileTargets=false

      - name: Build
        run: dotnet build PersonalRecorder.WorkloadFree.slnf --no-restore -c Release -p:IncludeMobileTargets=false

      - name: Test
        run: dotnet test PersonalRecorder.WorkloadFree.slnf --no-build -c Release -p:IncludeMobileTargets=false --logger "trx;LogFileName=test-results.trx"

      - name: Publish web (PWA)
        run: dotnet publish components/web/PersonalRecorder.Web -c Release -o artifacts/web -p:IncludeMobileTargets=false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/*.trx"

  # Android build runs separately: the workload install is slow and its failures should
  # be legible on their own rather than mixed into the core build.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workloads
        run: dotnet workload install maui-android android

      - name: Build capture core, harness and shell
        run: |
          dotnet build components/client/PersonalRecorder.Client -c Release
          dotnet build components/client/PersonalRecorder.Harness -c Release
          dotnet build components/client/PersonalRecorder.App -c Release

      # APK packaging and signing land with distribution v1 (ADR-012). Signing keys are
      # generated offline in a documented ceremony and never enter this repository.
