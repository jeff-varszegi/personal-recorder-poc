# Personal Recorder — local development stack.
#
# This is deliberately the whole backend: PostgreSQL + S3-compatible object storage.
# No Redis, no message broker (ADR-005). That is not only a lean-ops choice — a system
# that comes up with one `docker compose up` is a system other people can self-host,
# which is itself a censorship-resistance property (ARCHITECTURE.md §3.6).
#
#   docker compose -f tools/docker-compose.dev.yml up -d
#
# Credentials below are development-only and are committed on purpose. Real deployments
# supply their own via environment or secret store — never this file.

name: personal-recorder-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: personal-recorder-postgres
    environment:
      POSTGRES_USER: personalrecorder
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: personalrecorder
    ports:
      - "5432:5432"
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalrecorder -d personalrecorder"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: personal-recorder-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: personalrecorder
      MINIO_ROOT_PASSWORD: devonly-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - ../.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the evidence bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: personal-recorder-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 personalrecorder devonly-minio &&
      mc mb --ignore-existing local/evidence &&
      mc mb --ignore-existing local/artifacts &&
      echo 'buckets ready'
      "
